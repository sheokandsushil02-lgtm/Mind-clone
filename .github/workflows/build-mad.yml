name: Build MAD APK
on:
  push:
    branches: [ app-source ]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-source
      - name: Build via mad_build.sh
        run: bash overlay/mad_build.sh
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAD-REMS-APK
          path: app-merged/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
