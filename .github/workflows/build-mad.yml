name: Build MAD-Enabled REMS APK

on:
  push:
    branches: [ app-source ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          ref: app-source

      - name: Get original app ZIP from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:madgitfileforcloud.zip > original-app.zip
          ls -la original-app.zip

      - name: Unzip original project
        run: |
          unzip -q original-app.zip -d app-merged
          # ZIP ke andar ka root normalize karo
          if [ ! -f "app-merged/settings.gradle.kts" ]; then
            INNER=$(find app-merged -maxdepth 4 -name settings.gradle.kts -print -quit)
            echo "Found settings.gradle.kts at: $INNER"
            if [ -n "$INNER" ]; then
              ROOT=$(dirname "$INNER")
              mkdir -p /tmp/root
              mv app-merged/* /tmp/root/ 2>/dev/null || true
              rm -rf app-merged
              mkdir -p app-merged
              cp -r "$ROOT"/. app-merged/
              rm -rf /tmp/root
            fi
          fi
          ls app-merged

      - name: Overlay MAD files
        run: |
          cp -r overlay/. app-merged/
          find app-merged/app/src/main/java/com/example/mad/ -type f

      - name: Patch HomeScreen with MAD button
        run: python3 overlay/../app-merged/../overlay/patch_home.py app-merged/app/src/main/java/com/example/ui/screens/HomeScreen.kt

      - name: Patch Manifest
        run: python3 overlay/patch_manifest.py app-merged/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        working-directory: app-merged
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAD-REMS-APK
          path: app-merged/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
