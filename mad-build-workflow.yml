name: Build MAD-Enabled REMS APK

on:
  push:
    branches: [ app-source ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          ref: app-source

      - name: Get original app ZIP from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:madgitfileforcloud.zip > original-app.zip
          ls -la original-app.zip

      - name: Unzip and normalize project root
        run: |
          unzip -q original-app.zip -d extracted
          SETTING=$(find extracted -maxdepth 5 -name settings.gradle.kts -print -quit)
          if [ -z "$SETTING" ]; then
            SETTING=$(find extracted -maxdepth 5 -name build.gradle.kts -print -quit)
          fi
          if [ -z "$SETTING" ]; then
            echo "ERROR: project root not found"
            find extracted -maxdepth 3 | head -40
            exit 1
          fi
          ROOT=$(dirname "$SETTING")
          echo "Project root: $ROOT"
          mkdir -p app-merged
          cp -r "$ROOT"/. app-merged/
          rm -rf extracted original-app.zip
          ls app-merged

      - name: Overlay MAD files
        run: |
          cp -r overlay/app/. app-merged/app/
          cp overlay/patch_home.py overlay/patch_manifest.py app-merged/
          find app-merged/app/src/main/java/com/example/mad/ -type f

      - name: Patch HomeScreen with MAD button
        run: python3 app-merged/patch_home.py app-merged

      - name: Patch Manifest
        run: python3 app-merged/patch_manifest.py app-merged

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: app-merged
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAD-REMS-APK
          path: app-merged/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
