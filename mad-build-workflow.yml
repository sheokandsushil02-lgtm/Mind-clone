name: Build MAD-Enabled REMS APK

on:
  push:
    branches: [ app-source ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          ref: app-source

      - name: Get original app ZIP from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:madgitfileforcloud.zip > original-app.zip
          ls -la original-app.zip

      - name: Unzip original project
        run: |
          unzip -q original-app.zip -d app-merged
          ls app-merged | head -20
          if [ ! -f "app-merged/settings.gradle.kts" ]; then
            INNER=$(find app-merged -maxdepth 3 -name settings.gradle.kts | head -1)
            echo "inner root: $INNER"
            if [ -n "$INNER" ]; then
              mkdir -p /tmp/approot && mv app-merged "$(dirname "$INNER")/../..?/" 2>/dev/null || true
            fi
          fi

      - name: Overlay MAD files copy karo
        run: |
          cp -r overlay/. app-merged/
          find app-merged/app/src/main/java/com/example/mad/ -type f || echo "MAD files missing!"

      - name: Patch HomeScreen — MAD button
        run: |
          cd app-merged
          FILE="app/src/main/java/com/example/ui/screens/HomeScreen.kt"
          if grep -q "hub_mad_button" "$FILE"; then
            echo "MAD button already present"
          else
            python3 <<'PYEOF'
          import io
          path = "app/src/main/java/com/example/ui/screens/HomeScreen.kt"
          src = io.open(path, encoding="utf-8").read()

          mad_import = 'import com.example.mad.MadLauncher\n'
          anchor = 'import com.example.utils.ShareAndPrintUtils\n'
          if anchor in src and mad_import not in src:
              src = src.replace(anchor, anchor + mad_import, 1)

          mad_button = '''
          Spacer(modifier = Modifier.height(16.dp))

          // === MAD AI BUTTON (naya feature — overlay) ===
          Card(
              modifier = Modifier
                  .fillMaxWidth()
                  .testTag("hub_mad_button")
                  .clickable { MadLauncher.open(context) },
              shape = RoundedCornerShape(28.dp),
              colors = CardDefaults.cardColors(containerColor = EditorialLilac),
              border = androidx.compose.foundation.BorderStroke(1.dp, EditorialBorderLight)
          ) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(18.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .size(44.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(EditorialTextOnLilac),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(text = "🎙", fontSize = 22.sp)
                  }
                  Spacer(modifier = Modifier.width(14.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Actions.text(
                          text = "MAD — Live AI Assistant",
                          style = MaterialTheme.typography.titleMedium.copy(
                              fontWeight = FontWeight.SemiBold,
                              color = EditorialTextOnLilac,
                              fontSize = 16.sp
                          )
                      )
                      Text(
                          text = "Bol ke baat karo — Gemini live chat",
                          style = MaterialTheme.typography.bodySmall.copy(
                              color = EditorialTextOnLilac.copy(alpha = 0.8f),
                              fontSize = 12.sp
                          )
                      )
                  }
                  Icon(
                      imageVector = Icons.Default.ChevronRight,
                      contentDescription = "Open MAD",
                      tint = EditorialTextOnLilac,
                      modifier = Modifier.size(22.dp)
                  )
              }
          }
          '''
          src = src.replace(marker, mad_button + marker, 1)
          io.open(path, "w", encoding="utf-8").write(src)
          print("HomeScreen patched")
          PYEOF
          fi

      - name: Patch Manifest — RECORD_AUDIO permission
        run: |
          cd app- file:
          # (placeholder — real manifest patch step)
          echo ok
